---
- summary: |
    Успешный поиск товара по слову на английском языке
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Текст для поиска: Red Lipstick
  steps:
    - Ввести слово Red Lipstick в поле поиска
  expected-result: |
    В каталоге сразу (без нажатия Enter) остается только товар "Red Lipstick". Остальные товары исчезают из списка.

- summary: |
    Успешное добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Товар: Red Lipstick
  steps:
    - Нажать кнопку "Add to cart" на карточке товара
  expected-result: |
    Цифра на иконке "Cart" вверху справа увеличивается на 1 (например, с 8 на 9). Пользователь остается на той же странице с каталогом.

- summary: |
    Проверка карточки товара в каталоге
  requirement: |
    В карточке товара должны быть картинка, название, рейтинг, цена со скидкой и без
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Товар: Red Lipstick
  steps:
    - Найти товар "Red Lipstick" в каталоге
  expected-result: |
    На карточке видна картинка помады, название "Red Lipstick", рейтинг (91), старая цена 12.99$ (перечеркнутая) и новая цена 11.41$ красным цветом.

- summary: |
    Проверка сохранения товара в корзине при обновлении страницы
  requirement: |
    Корзина не должна очищаться при обновлении страницы
  prerequisites: |
    В корзину добавлен товар "Red Lipstick"
  test-data: |
    Не нужны
  steps:
    - Нажать кнопку F5 на клавиатуре
  expected-result: |
    После обновления страницы товар "Red Lipstick" не исчезает из корзины, а цифра на иконке "Cart" остается прежней (например, 8).
